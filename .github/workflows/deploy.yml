name: Deploy to VPS

on:
  push:
    branches: [ main ] # Change to 'master' if you use master

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/nextjs-ap
            exec 9>.git/galleria-deploy.lock
            flock -w 300 9
            GIT_TERMINAL_PROMPT=0 git fetch origin main
            git merge --no-edit FETCH_HEAD
            git merge-base --is-ancestor "${{ github.sha }}" HEAD
            npm install
            npm run build
            pm2 restart nextjs-app
