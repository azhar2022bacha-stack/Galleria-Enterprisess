  <ellipse cx="57" cy="43" rx="2" ry="3" fill="#1e3a8a"/>
  <circle cx="57.5" cy="42" r="0.8" fill="#ffffff"/>
  <ellipse cx="41" cy="47" rx="2" ry="1" fill="#fca5a5" opacity="0.7"/>
  <ellipse cx="59" cy="47" rx="2" ry="1" fill="#fca5a5" opacity="0.7"/>
  <path d="M48 49 Q50 51 52 49" stroke="#f43f5e" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Dress -->
  <path d="M44 57 L30 92 C42 95, 58 95, 70 92 L56 57 Z" fill="url(#dress)"/>
