  <path d="M26 35 C24 15, 76 15, 74 35 C70 42, 60 44, 50 44 C40 44, 30 42, 26 35 Z" fill="#60a5fa"/>
  <ellipse cx="50" cy="22" rx="22" ry="10" fill="#93c5fd" opacity="0.6"/>
  <!-- Hair back -->
