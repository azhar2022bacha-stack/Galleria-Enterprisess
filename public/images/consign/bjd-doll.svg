  <path d="M35 34 C42 32, 58 32, 65 34 C63 41, 55 42, 50 42 C45 42, 37 41, 35 34 Z" fill="url(#hair)"/>
  <ellipse cx="43" cy="43" rx="2" ry="3" fill="#1e3a8a"/>
