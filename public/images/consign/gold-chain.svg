  <path d="M28 10 C24 45, 30 92, 48 94 C54 94, 52 86, 44 80 C36 72, 34 38, 36 10" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
