<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="packGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="8" fill="#ffffff"/>
  <!-- Top handle -->
  <path d="M42 16 C42 11, 58 11, 58 16" stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Backpack body -->
  <path d="M26 32 C26 20, 36 17, 50 17 C64 17, 74 20, 74 32 L77 82 C77 88, 71 90, 50 90 C29 90, 23 88, 23 82 Z" fill="url(#packGrad)"/>
  <!-- Front main pocket -->
  <path d="M30 42 C30 36, 38 34, 50 34 C62 34, 70 36, 70 42 L68 82 C68 86, 62 87, 50 87 C38 87, 32 86, 32 82 Z" fill="url(#pocketGrad)" stroke="#475569" stroke-width="0.8"/>
  <!-- Zipper line 1 -->
  <path d="M30 36 Q50 33 70 36" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="2,1"/>
  <!-- Zipper line 2 -->
  <path d="M34 50 Q50 48 66 50" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="2,1"/>
  <!-- Front lower pocket -->
  <rect x="36" y="56" width="28" height="24" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <line x1="39" y1="62" x2="61" y2="62" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,1"/>
  <circle cx="50" cy="72" r="2" fill="#475569"/>
  <!-- Side mesh pockets -->
  <path d="M23 54 C21 62, 21 72, 24 78" stroke="#334155" stroke-width="2.5" fill="none"/>
  <path d="M77 54 C79 62, 79 72, 76 78" stroke="#334155" stroke-width="2.5" fill="none"/>
</svg>
